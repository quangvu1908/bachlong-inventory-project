name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          # Khóa publishable của Supabase - thiết kế để công khai, bảo mật nằm ở RLS
          NEXT_PUBLIC_SUPABASE_URL: "https://zuyhpvwrgsiyalsrigay.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_ii8_N5uAYnEWM3sGZF5tFw_lQJN-MWY"
        run: npx next build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
